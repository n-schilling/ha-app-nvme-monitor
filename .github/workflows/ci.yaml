name: CI
# scripts/check.sh runs the same checks locally; keep the two in step.

# Not on main: a commit reaches main only after CI passed for it on dev, and
# the release workflow checks that before it tags (ci-passed.sh)
on:
  push:
    branches: [dev]
  pull_request:
  schedule:
    # Weekly, so a new base image or app linter that breaks the build shows up
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: App configuration
        uses: frenck/action-addon-linter@b9cfd1bc62ba60d2c4fc96317b5f7ada5923f4a7 # v2.21.1
        with:
          path: ./nvme_monitor
      - name: Changelog has the version
        run: .github/scripts/changelog-section.sh nvme_monitor/CHANGELOG.md "$(yq -r '.version' nvme_monitor/config.yaml)" > /dev/null
      - name: No compiled Python in the repository
        run: |
          if git ls-files | grep -E '(^|/)__pycache__/|\.pyc$'; then
            echo "::error::compiled Python files are checked in"
            exit 1
          fi
      - name: Shell scripts
        run: >-
          shellcheck --shell=bash --severity=warning --external-sources
          nvme_monitor/rootfs/etc/s6-overlay/s6-rc.d/*/run
          nvme_monitor/rootfs/usr/local/lib/mqtt-device.sh
          tests/test_*.sh tests/stubs/nvme tests/stubs/mosquitto_* scripts/*.sh
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Python
        run: |
          pip install ruff==0.17.3
          ruff check nvme_monitor/rootfs/usr/local/lib tests scripts

  test:
    name: Build and test (${{ matrix.arch }})
    # Each architecture on a runner of its own kind, no emulation (no QEMU):
    # the image is built and tested natively. The arm64 runners are free for
    # public repositories, which all apps are
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          version=$(yq -r '.version' nvme_monitor/config.yaml)
          docker build --build-arg "BUILD_VERSION=${version}" -t nvme-monitor:test nvme_monitor
      - name: Image architecture
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          arch=$(docker image inspect --format '{{.Architecture}}' nvme-monitor:test)
          echo "image: ${arch}"
          [[ "${ARCH}/${arch}" == amd64/amd64 || "${ARCH}/${arch}" == aarch64/arm64 ]]
      - name: Test
        run: >-
          docker run --rm --network none
          -v "${PWD}/tests:/tests:ro" --entrypoint bash nvme-monitor:test
          /tests/test_monitor.sh
      - name: Test the image
        run: >-
          docker run --rm --network none
          -v "${PWD}/tests:/tests:ro" --entrypoint bash nvme-monitor:test
          /tests/test_image.sh
      - name: Test the web page
        run: >-
          docker run --rm --network none
          -v "${PWD}/tests:/tests:ro" --entrypoint python3 nvme-monitor:test
          -m unittest discover -v -s /tests -p 'test_*.py'

  page:
    name: Page
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          version=$(yq -r '.version' nvme_monitor/config.yaml)
          docker build --build-arg "BUILD_VERSION=${version}" \
            -t nvme-monitor:page nvme_monitor
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      # The runner's Google Chrome; Playwright's Chromium (and its packages
      # from the Ubuntu mirrors) only when there is none
      - name: Playwright
        run: |
          pip install playwright==1.65.0
          if command -v google-chrome; then google-chrome --version
          else python -m playwright install --with-deps chromium; fi
      - name: Page through ingress (header, version line, console, light, dark, phone)
        run: python scripts/screenshots.py --image nvme-monitor:page --out screenshots
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore

  broker:
    name: Against a real MQTT broker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          version=$(yq -r '.version' nvme_monitor/config.yaml)
          docker build --build-arg "BUILD_VERSION=${version}" \
            -t nvme-monitor:test nvme_monitor
      - name: Start the broker
        run: |
          docker network create ci
          docker run -d --name broker --network ci \
            -v "${PWD}/tests/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro" eclipse-mosquitto:2.1.2-alpine
      - name: Test
        run: >-
          docker run --rm --network ci --add-host supervisor:127.0.0.1 -v "${PWD}/tests:/tests:ro" --entrypoint bash
          nvme-monitor:test /tests/test_broker.sh
      - name: Broker log
        if: failure()
        run: docker logs broker

