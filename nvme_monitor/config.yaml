name: NVMe Monitor
version: "3.0.0"
slug: nvme_monitor
description: Health, wear and temperatures of the host's NVMe drives on a web page, with a Drive problem sensor via MQTT discovery
url: https://github.com/n-schilling/ha-app-nvme-monitor
arch:
  - aarch64
  - amd64
startup: services
init: false
ingress: true
panel_icon: mdi:harddisk
panel_title: NVMe
services:
  - mqtt:need
privileged:
  - SYS_ADMIN
devices:
  - /dev/nvme0
  - /dev/nvme1
  - /dev/nvme2
  - /dev/nvme3
options:
  interval: 60
  discovery_prefix: homeassistant
  log_level: info
schema:
  interval: int(30,3600)
  discovery_prefix: str
  log_level: list(info|warning|error)
